l_english:
 peterland.2.t: "the Pertland Coup"
 peterland.2.d: "Today at 2 PM, Archidon and Swordwrath rebels stormed the parliament building and seized control of the government. Loyalist forces were caught off guard and proved unable to organise a response. Within hours, key government offices and military positions across Pertland had fallen to the rebels.\n\nThe old order is no more. The rebels have now announced the formation of a new government and ordered the army to recognise their authority."
 peterland.2.a: "It was really for the good of the people."
