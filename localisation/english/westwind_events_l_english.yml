l_english:
 westwind.1.t: "The Westwind Coup"
 westwind.1.d: "Earlier today, riots broke out in the streets of the capital, quickly escalating into violent clashes with the police. Amidst the chaos, a coordinated assault on the parliament building by Archidon and Swordwrath rebels led to its capture.\n\nHowever, significant resistance has been organised by a rogue group of generals, supported by a small fraction of the army. Unless a miracle occurs, a bloody civil war now appears unavoidable."
 westwind.1.a: "For the revolution!"

